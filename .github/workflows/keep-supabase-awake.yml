name: keep Supabase active

on:
  schedule:
    # Three small database reads per day, away from the top of the hour (UTC).
    - cron: "23 2,10,18 * * *"
    # Public repositories lose scheduled workflows after 60 days without activity.
    - cron: "41 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-read:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/keep-supabase-awake.mjs

  repository-activity:
    if: github.event_name == 'schedule' && github.event.schedule == '41 5 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Keep public-repository schedules enabled
        run: |
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit --allow-empty -m 'chore: keep scheduled workflows active'
          git push origin HEAD:main
