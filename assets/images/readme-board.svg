    <text x="84" y="296" fill="#5b625b" font-family="Arial, Helvetica, sans-serif" font-size="16">a personal space for what is made</text>
    <text x="84" y="319" fill="#5b625b" font-family="Arial, Helvetica, sans-serif" font-size="16">and what is learned along the way.</text>
