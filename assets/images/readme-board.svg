<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title description">
  <title id="title">archive</title>
  <desc id="description">A quiet cream paper board with work, notes, about, and a small row of line-drawn external links.</desc>
