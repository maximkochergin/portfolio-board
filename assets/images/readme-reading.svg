    <linearGradient id="ground" x2="1" y2="1">
      <stop stop-color="#f1eee7"/>
      <stop offset="1" stop-color="#eae5dc"/>
    </linearGradient>
    <linearGradient id="sheet" x2="0" y2="1">
      <stop stop-color="#faf8f2"/>
      <stop offset="1" stop-color="#f3efe7"/>
    </linearGradient>
  </defs>
  <path fill="url(#ground)" d="M0 0h1200v330H0z"/>
  <path d="M48 35h1104M48 295h1104" fill="none" stroke="#d2cec5" stroke-width="1"/>
  <g fill="#5b625b" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="1.4">
    <text x="80" y="62">01 / browse</text>
    <text x="688" y="62">02 / read</text>
  </g>
  <path d="M80 77h450v197H80zM674 77h446v197H674z" fill="#9c907d" opacity=".12" transform="translate(5 6)"/>
  <g fill="url(#sheet)" stroke="#aaa99f" stroke-width="1">
