    <path d="M674 77h446v197H674z"/>
  </g>
  <g fill="#282a28" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-style="italic">
    <text x="112" y="112">work</text>
    <text x="179" y="112">notes</text>
