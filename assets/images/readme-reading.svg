<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title description">
  <title id="title">from index to reading view</title>
  <desc id="description">Two fine-lined paper sheets show an index of untitled entries leading to an open page, without inventing published work.</desc>
