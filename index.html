<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A small place for work, notes, and the things in between." />
    <meta name="theme-color" content="#e9e8e1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self' https://bctmgeblffqdmkiioxuf.supabase.co; object-src 'none'; base-uri 'none'; form-action 'self'" />
    <title>work and notes</title>
    <link rel="icon" href="./assets/icons/paper-mark.svg" type="image/svg+xml" />
    <link rel="preload" href="./assets/fonts/Telma-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="./styles.css?v=greeting-1" />
  </head>
  <body>
    <main class="page">
      <article class="board" aria-label="personal space">
        <nav class="switcher" aria-label="sections" role="tablist">
          <button id="tab-work" type="button" role="tab" aria-selected="true" aria-controls="panel-work">work</button>
          <button id="tab-notes" type="button" role="tab" aria-selected="false" aria-controls="panel-notes" tabindex="-1">notes</button>
          <button id="tab-about" type="button" role="tab" aria-selected="false" aria-controls="panel-about" tabindex="-1">about</button>
        </nav>
        <div class="search-region" id="search-region" hidden>
          <label class="sr-only" for="search-input">search posts</label>
          <input id="search-input" type="search" maxlength="120" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="search" />
          <button class="plain clear-search" id="clear-search" type="button" hidden>clear</button>
        </div>
        <div class="content">
          <section class="panel" id="panel-work" role="tabpanel" aria-labelledby="tab-work" tabindex="0"><div class="post-list" data-category="work"></div></section>
          <section class="panel" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" tabindex="0" hidden><div class="post-list" data-category="notes"></div></section>
          <section class="panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about" tabindex="0" hidden><div class="post-list" data-category="about"></div></section>
          <section class="panel detail" id="post-detail" aria-label="post" tabindex="-1" hidden>
            <button class="plain back" type="button" id="back-to-list">back</button>
            <p class="detail-meta" id="detail-meta" hidden>draft</p>
            <h1 id="detail-title"></h1>
            <p class="subtitle" id="detail-subtitle" hidden></p>
            <p class="body" id="detail-body"></p>
            <a id="detail-link" target="_blank" rel="noopener noreferrer" hidden></a>
            <p class="detail-error" id="detail-error" role="alert" hidden></p>
            <div class="owner-actions" id="owner-actions" hidden><button class="plain" type="button" id="edit-post">edit</button><button class="plain" type="button" id="delete-post">delete</button></div>
          </section>
        </div>
        <div class="board-foot">
          <button class="add" id="new-post" type="button" aria-label="new post" title="new post" hidden>+</button>
          <span class="day-greeting" id="day-greeting"></span>
        </div>
      </article>
    </main>
    <dialog id="composer" aria-labelledby="composer-title">
      <form id="post-form">
        <div class="dialog-header"><h2 id="composer-title">new post</h2></div>
        <label for="category">publish in</label>
        <select id="category" name="category"><option value="work">work</option><option value="notes">notes</option><option value="about">about</option></select>
        <label for="post-title">title</label>
        <input id="post-title" name="title" maxlength="120" required autocomplete="off" placeholder="a small beginning" />
        <div class="about-fields" id="about-fields" hidden>
          <label for="post-subtitle">short introduction <span>(optional)</span></label>
          <input id="post-subtitle" name="subtitle" maxlength="160" autocomplete="off" placeholder="a little more about me" />
          <label for="post-link">related link <span>(optional)</span></label>
          <input id="post-link" name="link" type="url" maxlength="500" inputmode="url" placeholder="https://example.com" />
        </div>
        <label for="post-body">text</label>
        <textarea id="post-body" name="body" maxlength="20000" required placeholder="write something..."></textarea>
        <p class="error" id="form-error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="plain" id="cancel-composer">discard</button>
          <div class="publish-actions"><button type="submit" class="plain" id="save-draft" name="intent" value="draft">save draft</button><button type="submit" class="plain" id="submit-post" name="intent" value="published">publish</button></div>
        </div>
      </form>
    </dialog>
    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <form id="auth-form" novalidate>
        <div class="dialog-header"><h2 id="auth-title">owner access</h2></div>
        <p class="dialog-copy" id="auth-copy">enter your email to receive a sign-in link.</p>
        <label for="auth-email">email</label>
        <input id="auth-email" type="email" autocomplete="email" inputmode="email" maxlength="254" required />
        <p class="error" id="auth-error" role="alert" hidden></p>
        <div class="actions"><button type="button" class="plain" id="cancel-auth">cancel</button><button type="submit" class="plain" id="send-sign-in">send link</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <form method="dialog">
        <div class="dialog-header"><h2 id="confirm-title"></h2></div>
        <p class="dialog-copy" id="confirm-copy"></p>
        <div class="actions"><button class="plain" value="cancel">keep post</button><button class="plain" value="confirm" id="confirm-action"></button></div>
      </form>
    </dialog>
    <script src="./config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous" defer></script>
    <script src="./site.js?v=greeting-1" defer></script>
  </body>
</html>
