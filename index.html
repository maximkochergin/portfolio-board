    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"archive","url":"https://maximkochergin.github.io/portfolio-board/","description":"A small place for work, notes, and the things in between."}</script>
  </head>
  <body>
    <main class="intro" id="intro" hidden>
      <div class="intro-stage">
        <h1 class="intro-greeting" id="intro-greeting"><span class="intro-clear" id="intro-clear"></span></h1>
      </div>
      <button class="intro-skip" id="intro-skip" type="button">skip intro</button>
    </main>
    <main class="page">
      <p class="sr-only" id="board-status" role="status" aria-live="polite">loading posts.</p>
      <div class="paper-lift"><article class="board" aria-label="personal space">
        <header class="board-head">
          <h1 class="sr-only">archive</h1>
          <nav class="switcher" aria-label="sections" role="tablist">
            <button id="tab-work" type="button" role="tab" aria-selected="true" aria-controls="panel-work">work</button>
            <button id="tab-notes" type="button" role="tab" aria-selected="false" aria-controls="panel-notes" tabindex="-1">notes</button>
            <button id="tab-about" type="button" role="tab" aria-selected="false" aria-controls="panel-about" tabindex="-1">about</button>
          </nav>
        </header>
        <div class="search-region" id="search-region" hidden>
          <label class="sr-only" for="search-input">search posts</label>
          <input id="search-input" type="search" maxlength="120" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="search" />
          <button class="plain clear-search" id="clear-search" type="button" hidden>clear</button>
        </div>
        <div class="content">
          <section class="panel" id="panel-work" role="tabpanel" aria-labelledby="tab-work" tabindex="0"><div class="post-list" data-category="work"><div class="empty-state"><p>loading...</p></div></div></section>
          <section class="panel" id="panel-notes" role="tabpanel" aria-labelledby="tab-notes" tabindex="0" hidden><div class="post-list" data-category="notes"></div></section>
          <section class="panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about" tabindex="0" hidden><div class="post-list" data-category="about"></div></section>
          <section class="panel detail" id="post-detail" aria-label="post" tabindex="-1" hidden>
            <button class="plain back" type="button" id="back-to-list">back</button>
            <p class="detail-meta" id="detail-meta" hidden>draft</p>
            <h1 id="detail-title"></h1>
            <p class="subtitle" id="detail-subtitle" hidden></p>
            <p class="body" id="detail-body"></p>
            <a id="detail-link" target="_blank" rel="noopener noreferrer" hidden></a>
            <div class="share-action" id="share-action" hidden><button class="plain" id="copy-post-link" type="button">copy link</button><span class="copy-status" id="copy-link-status" role="status" aria-live="polite"></span></div>
            <p class="detail-error" id="detail-error" role="alert" hidden></p>
            <div class="owner-actions" id="owner-actions" hidden><button class="plain" type="button" id="edit-post">edit</button><button class="plain" type="button" id="delete-post">delete</button></div>
          </section>
        </div>
        <footer class="board-foot">
          <div class="board-controls" id="board-controls" hidden>
            <button class="add" id="new-post" type="button" aria-label="new post" title="new post" hidden>+</button>
            <button class="plain" id="edit-links" type="button">edit links</button>
          </div>
          <nav class="contacts" id="contacts" aria-label="external profiles" hidden>
            <span class="contacts-label" aria-hidden="true">elsewhere</span>
            <div class="contact-icons" id="contact-icons"></div>
          </nav>
        </footer>
      </article></div>
    </main>
    <aside class="ambient-clock" id="ambient-clock" aria-label="your local time">
      <span class="clock-label">your local time</span>
      <time class="clock-time" id="clock-time"></time>
      <button class="clock-toggle" id="clock-toggle" type="button" aria-controls="clock-time" aria-expanded="true">hide time</button>
    </aside>
    <dialog id="composer" aria-labelledby="composer-title">
      <form id="post-form">
        <div class="dialog-header"><h2 id="composer-title">new post</h2></div>
        <label for="category">publish in</label>
        <select id="category" name="category"><option value="work">work</option><option value="notes">notes</option><option value="about">about</option></select>
        <label for="post-title">title</label>
        <input id="post-title" name="title" maxlength="120" required autocomplete="off" placeholder="a small beginning" />
        <div class="about-fields" id="about-fields" hidden>
          <label for="post-subtitle">short introduction <span>(optional)</span></label>
          <input id="post-subtitle" name="subtitle" maxlength="160" autocomplete="off" placeholder="a little more about me" />
          <label for="post-link">related link <span>(optional)</span></label>
          <input id="post-link" name="link" type="url" maxlength="500" inputmode="url" placeholder="https://example.com" />
        </div>
        <label for="post-body">text</label>
        <textarea id="post-body" name="body" maxlength="20000" required placeholder="write something..."></textarea>
        <p class="error" id="form-error" role="alert" hidden></p>
        <div class="actions">
          <button type="button" class="plain" id="cancel-composer">discard</button>
          <div class="publish-actions"><button type="submit" class="plain" id="save-draft" name="intent" value="draft">save draft</button><button type="submit" class="plain" id="submit-post" name="intent" value="published">publish</button></div>
        </div>
      </form>
    </dialog>
    <dialog id="links-dialog" aria-labelledby="links-title">
      <form id="links-form" novalidate>
        <div class="dialog-header"><h2 id="links-title">external links</h2></div>
        <p class="dialog-copy">leave a field empty to hide its icon. changes appear for everyone.</p>
        <label for="link-email">email</label><input id="link-email" name="email" type="email" maxlength="254" autocomplete="off" placeholder="you@example.com" />
        <label for="link-github">github</label><input id="link-github" name="github" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://github.com/…" />
        <label for="link-linkedin">linkedin</label><input id="link-linkedin" name="linkedin" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://linkedin.com/in/…" />
        <label for="link-telegram">telegram</label><input id="link-telegram" name="telegram" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://t.me/…" />
        <label for="link-discord">discord</label><input id="link-discord" name="discord" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://discord.gg/…" />
        <label for="link-x">x</label><input id="link-x" name="x" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://x.com/…" />
        <label for="link-cv">cv</label><input id="link-cv" name="cv" type="url" maxlength="500" inputmode="url" autocomplete="off" placeholder="https://…" />
        <p class="error" id="links-error" role="alert" hidden></p>
        <div class="actions"><button type="button" class="plain" id="close-links">back</button><button type="submit" class="plain" id="save-links">save links</button></div>
      </form>
    </dialog>
    <dialog id="auth-dialog" aria-labelledby="auth-title">
      <form id="auth-form" novalidate>
        <div class="dialog-header"><h2 id="auth-title">owner access</h2></div>
        <p class="dialog-copy" id="auth-copy">enter your email to receive a sign-in link.</p>
        <label for="auth-email">email</label>
        <input id="auth-email" type="email" autocomplete="email" inputmode="email" maxlength="254" required />
        <p class="error" id="auth-error" role="alert" hidden></p>
        <div class="actions"><button type="button" class="plain" id="cancel-auth">cancel</button><button type="submit" class="plain" id="send-sign-in">send link</button></div>
      </form>
    </dialog>
    <dialog id="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-copy">
      <form method="dialog">
        <div class="dialog-header"><h2 id="confirm-title"></h2></div>
        <p class="dialog-copy" id="confirm-copy"></p>
        <div class="actions"><button class="plain" value="cancel">keep post</button><button class="plain" value="confirm" id="confirm-action"></button></div>
      </form>
    </dialog>
    <svg class="icon-defs" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <symbol id="contact-email" viewBox="0 0 24 24"><rect x="3.5" y="6" width="17" height="12" rx="1.5"/><path d="m4 7 8 6 8-6"/></symbol>
      <symbol id="contact-github" viewBox="0 0 24 24"><path d="M7 8 6.5 4.5 9.5 6a9 9 0 0 1 5 0l3-1.5L17 8a7 7 0 0 1 2 5c0 3.8-2.9 6.5-7 6.5S5 16.8 5 13a7 7 0 0 1 2-5Z"/><path d="M8.5 16.5c.8 1 2 1.5 3.5 1.5s2.7-.5 3.5-1.5M5.5 15.5c-1.3.2-2.2-.2-2.7-1.2"/><path d="M9.5 12.4h.01M14.5 12.4h.01" stroke-linecap="round" stroke-width="2.4"/></symbol>
      <symbol id="contact-linkedin" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M8 10v7m0-9.5v.1M12 17v-7m0 2.8c0-1.8 1.2-2.8 2.7-2.8 1.7 0 2.6 1.1 2.6 3V17"/></symbol>
      <symbol id="contact-telegram" viewBox="0 0 24 24"><path d="M20.5 4.5 3.8 11.2c-.7.3-.6 1.3.1 1.5l4.2 1.2 1.5 4.7c.2.7 1.1.8 1.5.2L20.5 4.5Z"/><path d="m8.1 13.9 8.8-6.2-6.1 8.4"/></symbol>
      <symbol id="contact-discord" viewBox="0 0 24 24"><path d="M6 7.5a16 16 0 0 1 4-1l.5 1a11 11 0 0 1 3 0l.5-1a16 16 0 0 1 4 1c1.2 2.1 2 4.5 2.2 7.4a15 15 0 0 1-4.6 2.6l-.8-1.3M6 7.5c-1.2 2.1-2 4.5-2.2 7.4a15 15 0 0 0 4.6 2.6l.8-1.3M9 16c2 1 4 1 6 0"/><path d="M8.9 12.5h.1m6 0h.1" stroke-width="2.3" stroke-linecap="round"/></symbol>
      <symbol id="contact-x" viewBox="0 0 24 24"><path d="M4.5 4.5h3.2l11.8 15h-3.2zM19.5 4.5l-6.1 7.1M4.5 19.5l6.2-7.2"/></symbol>
      <symbol id="contact-cv" viewBox="0 0 24 24"><path d="M6 3.5h8l4 4V20H6zM14 3.5v4h4M9 11h6M9 14h6M9 17h4"/></symbol>
    </svg>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.0/dist/umd/supabase.js" integrity="sha384-xPW3QHswsICVC2mW6BFNwMbhpLkbZ133fKOhxNx3QGGgAOJfL3O9t8r2aWn1aez6" crossorigin="anonymous" defer></script>
